name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify AIDD harness
        if: hashFiles('scripts/verify-harness.mjs') != ''
        run: |
          node scripts/verify-harness.mjs .
          for file in bin/aidd scripts/*.sh; do bash -n "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          node --test --experimental-test-coverage --test-coverage-lines=80 tests/*.test.mjs

      - name: Install application dependencies
        if: hashFiles('scripts/verify-harness.mjs') == '' && hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Verify application
        if: hashFiles('scripts/verify-harness.mjs') == '' && hashFiles('package-lock.json') != ''
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Require CI configuration
        if: hashFiles('scripts/verify-harness.mjs') == '' && hashFiles('package-lock.json') == ''
        run: |
          echo 'package-lock.jsonがありません。採用スタックに合わせてCIを設定してください。' >&2
          exit 1
